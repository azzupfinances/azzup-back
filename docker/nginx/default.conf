# Serves src/public and forwards PHP requests to the app (PHP-FPM) service.
# See docs/infrastructure/nginx.md
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Keep in sync with post_max_size in docker/php/uploads.ini.
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
