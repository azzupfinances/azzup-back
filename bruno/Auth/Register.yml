info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Maria Silva",
        "cpf": "529.982.247-25",
        "email": "maria@example.com",
        "phone": "(11) 91234-5678",
        "password": "secret123",
        "password_confirmation": "secret123",
        "salary_payment_day": 5
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body.data && body.data.token) {
          bru.setEnvVar('token', body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
