info:
  name: Update bill
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/bills/1"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Rent",
        "category": "housing",
        "amount_cents": 125000,
        "due_day": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
