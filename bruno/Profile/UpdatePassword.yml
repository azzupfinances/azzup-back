info:
  name: Update password
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/profile/password"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "secret123",
        "password": "new-secret123",
        "password_confirmation": "new-secret123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
