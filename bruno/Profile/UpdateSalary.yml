info:
  name: Update salary
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/profile"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "gross_salary_cents": 650000,
        "salary_payment_day": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
